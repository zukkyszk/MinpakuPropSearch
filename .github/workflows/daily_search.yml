name: 民泊物件 日次自動検索

on:
  schedule:
    # 毎朝8時 JST (UTC 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN（通知しない）"
        type: boolean
        default: false
      force:
        description: "FORCE（既見物件も通知）"
        type: boolean
        default: false

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # seen_properties.json のコミット用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 最新の seen_properties.json を取得するため fetch-depth: 0
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run property search
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python main.py $ARGS

      - name: Commit updated seen_properties.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_properties.json
          # 変更がある場合のみコミット
          git diff --cached --quiet || git commit -m "chore: update seen_properties [skip ci]"
          git push
