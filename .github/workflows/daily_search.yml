name: 民泊物件 日次自動検索

on:
  schedule:
    # 毎朝8時 JST (UTC 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN（通知しない）"
        type: boolean
        default: false
      force:
        description: "FORCE（既見物件も通知）"
        type: boolean
        default: false
      no_reins:
        description: "REINS をスキップ"
        type: boolean
        default: false
      first_run:
        description: "初回実行モード（昨日〜今日の物件のみ）"
        type: boolean
        default: false

jobs:
  search:
    # self-hosted ランナーを使う場合は下の行のコメントを外し、ubuntu-latest 行をコメントアウト
    # runs-on: [self-hosted, windows]   # Windows PC の場合
    # runs-on: [self-hosted, linux]     # Linux PC / VPS の場合
    runs-on: ubuntu-latest              # ← IP ブロックされる場合は上記に切り替え
    permissions:
      contents: write  # seen_properties.json のコミット用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome (for REINS Selenium)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run property search
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL }}
          REINS_USER: ${{ secrets.REINS_USER }}
          REINS_PASSWORD: ${{ secrets.REINS_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.no_reins }}" = "true" ]; then
            ARGS="$ARGS --no-reins"
          fi
          if [ "${{ github.event.inputs.first_run }}" = "true" ]; then
            ARGS="$ARGS --first-run"
          fi
          python main.py $ARGS

      - name: Commit updated seen_properties.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_properties.json
          git diff --cached --quiet || git commit -m "chore: update seen_properties [skip ci]"
          git push
