searches:
  # -------------------------------------------------------
  # プロファイル1: 東京 戸建て
  # -------------------------------------------------------
  - name: 東京戸建て
    areas:
      - 新宿区
      - 台東区
      - 港区
      - 墨田区
      - 江東区
    property_types:
      - 戸建て
    max_price: 30000000   # 3,000万円
    min_price: 3000000    # 300万円
    min_yield: 6.0
    max_building_age: 35

  # -------------------------------------------------------
  # プロファイル2: 神奈川 戸建て
  # -------------------------------------------------------
  - name: 神奈川戸建て
    areas:
      - 横浜市中区
      - 横浜市西区
      - 川崎市
    property_types:
      - 戸建て
    max_price: 20000000   # 2,000万円
    min_price: 3000000
    min_yield: 7.0
    max_building_age: 40

  # -------------------------------------------------------
  # プロファイル3: 東京 一棟ビル
  # -------------------------------------------------------
  - name: 東京ビル
    areas:
      - 新宿区
      - 渋谷区
      - 港区
      - 中央区
    property_types:
      - ビル
      - 一棟ビル
    max_price: 50000000   # 5,000万円
    min_price: 10000000   # 1,000万円
    min_yield: 7.0
    max_building_age: 40

  # -------------------------------------------------------
  # プロファイル4: 東京 マンション・アパート
  # -------------------------------------------------------
  - name: 東京マンション・アパート
    areas:
      - 新宿区
      - 台東区
      - 渋谷区
      - 港区
    property_types:
      - 一棟マンション
      - アパート
    max_price: 50000000
    min_price: 5000000
    min_yield: 8.0
    max_building_age: 40

  # -------------------------------------------------------
  # プロファイル5: 大阪・京都 全種別
  # -------------------------------------------------------
  - name: 大阪・京都
    areas:
      - 大阪市中央区
      - 大阪市浪速区
      - 大阪市西区
      - 京都市東山区
      - 京都市中京区
    property_types: []    # 空 = 全種別
    max_price: 50000000
    min_price: 3000000
    min_yield: 7.0
    max_building_age: 40

evaluation:
  # 民泊優遇エリア（加点対象）
  preferred_areas:
    - 新宿区
    - 渋谷区
    - 台東区
    - 中央区
    - 港区
    - 京都市
    - 大阪市中央区
    - 大阪市浪速区
    - 大阪市西区

  # 通知する最低スコア（100点満点）
  min_score: 50

notification:
  subject_prefix: "[民泊物件]"
